<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#071d26">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; connect-src 'self' https://*.supabase.co; form-action 'self';">
<title>Catálogo de embarcações · Gran Fish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cadastro.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/chatbot.css">
<link rel="stylesheet" href="css/catalogo.css">
</head>
<body data-publico>
<main class="wrap" style="padding:36px 0 90px">
  <div>
    <a href="index.html" class="cat-btn-voltar" aria-label="Voltar para a página inicial">
      <span aria-hidden="true">←</span> Voltar ao site Gran Fish
    </a>
  </div>
  <h1 style="font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:6px">Catálogo de embarcações</h1>
  <p style="color:var(--muted);margin:0 0 22px">Fichas técnicas e itens de série de todos os modelos Gran Fish. Acesso livre, sem login.</p>

  <section id="painel" hidden>
    <div class="stats" id="linhas"></div>

    <div class="admin-bar">
      <input type="search" id="busca" placeholder="Buscar modelo, código ou item de série (ex.: giropesca)" aria-label="Buscar">
      <div class="cat-vista" role="group" aria-label="Modo de exibição">
        <button type="button" class="button" id="v-cards" aria-pressed="true">Modelos</button>
        <button type="button" class="button" id="v-tab" aria-pressed="false">Comparativo</button>
      </div>
    </div>

    <p class="nota" id="contagem"></p>
    <div class="cat-grid" id="cards"></div>

    <div class="card tabela-wrap" id="comparativo" hidden>
      <table class="lista cat-tab">
        <thead><tr>
          <th>Modelo</th><th>Compr.</th><th>Boca</th><th>Pontal</th><th>Lotação</th><th>Motorização</th><th>Peso</th><th>Carga</th><th></th>
        </tr></thead>
        <tbody id="tab-linhas"></tbody>
      </table>
    </div>
    <p class="nota" id="vazio" hidden>Nenhum modelo encontrado.</p>
  </section>

  <section id="negado" class="card" hidden>
    <h2 class="card-title">Acesso restrito</h2>
    <p>Entre primeiro na área interna para ver o catálogo.</p>
    <a class="button button--copper" href="cadastros-admin.html?next=catalogo-admin.html">Entrar</a>
  </section>
</main>

<dialog id="modal" class="cat-modal" aria-label="Ficha do modelo"></dialog>

<script src="js/cadastro-config.js"></script>
<script src="js/catalogo-dados.js"></script>
<script src="js/catalogo-admin.js" defer></script>
<script src="js/site-campos.js"></script><script src="js/site-personalizar.js" defer></script>
<script src="js/chatbot.js" defer></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
