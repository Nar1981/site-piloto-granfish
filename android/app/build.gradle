plugins {
    id 'com.android.application'
}

android {
    namespace 'com.granfish.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.granfish.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystoreFile = file('../granfish-release.jks')
            if (!keystoreFile.exists()) {
                keystoreFile = file('granfish-release.jks')
            }
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: "granfish2026"
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "granfish"
                keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: "granfish2026"
            }
        }
    }

    buildTypes {
        release {
            def keystoreFile = file('../granfish-release.jks')
            if (!keystoreFile.exists()) {
                keystoreFile = file('granfish-release.jks')
            }
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
