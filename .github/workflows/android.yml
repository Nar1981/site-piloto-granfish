name: Build Android App (APK & Play Store AAB)

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android AAB and APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Ensure Release Keystore exists
        run: |
          if [ ! -f "android/granfish-release.jks" ]; then
            echo "Generating production release keystore..."
            keytool -genkeypair -v \
              -keystore android/granfish-release.jks \
              -alias granfish \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass granfish2026 \
              -keypass granfish2026 \
              -dname "CN=Gran Fish, OU=Mobile, O=Gran Fish Nautica, L=Sao Paulo, ST=SP, C=BR"
          else
            echo "Using existing release keystore."
          fi

      - name: Build Android App Bundle (AAB for Google Play)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build Android APKs (Release and Debug)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: GranFish-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GranFish-Android-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GranFish-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release Signing Keystore
        uses: actions/upload-artifact@v4
        with:
          name: GranFish-Release-Keystore
          path: android/granfish-release.jks
          if-no-files-found: warn
          retention-days: 30

      - name: Persist Keystore to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "android/granfish-release.jks" ] && git status --porcelain | grep -q "granfish-release.jks"; then
            git add android/granfish-release.jks
            git commit -m "chore(android): save release keystore for Play Store reproducibility" || echo "Nothing to commit"
            git push origin main || echo "Push skipped or not permitted"
          fi
